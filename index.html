<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guadaye Baltina Mart</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
<style type="text/tailwindcss">
  .inp{@apply w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500}
  .card{@apply bg-slate-900 border border-slate-800 rounded-2xl p-3}
  .lbl{@apply block text-xs text-slate-400 mb-1 font-medium}
</style>
<style>
  ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#334155;border-radius:9999px}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, writeBatch, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// ====== CONFIG: paste your real values ======
const MOM_EMAIL = "mom@mart.com"; // the email/password user you create in Firebase Authentication
const firebaseConfig = {
  apiKey: "AIzaSyCa4zXhFLTvp8eseRAQ-YEbOtzQZvaB4I8",
  authDomain: "guadaye-mart.firebaseapp.com",
  projectId: "guadaye-mart",
  storageBucket: "guadaye-mart.firebasestorage.app",
  messagingSenderId: "213102148191",
  appId: "1:213102148191:web:cfbc402bd70af6028ef9ea"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// Offline cache: shop can keep selling without internet; writes sync automatically later.
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

// ====== Helpers ======
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const tStr = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const money = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const PLACEHOLDER = 'https://placehold.co/100x100/1e293b/f59e0b?text=Baltina';

let isMom = false, tab = 'inventory', filter = 'all', viewDate = dKey();
let items = [], sales = [], notifs = [], cart = [];
let img = '', editId = null, statusId = null, unsubs = [], firstNotif = true;

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'p-3 rounded-xl text-xs font-semibold shadow-lg border backdrop-blur-md pointer-events-auto ' +
    (type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' : type === 'success' ? 'bg-emerald-950/90 border-emerald-800 text-emerald-200' : 'bg-slate-900/90 border-slate-700 text-slate-200');
  t.textContent = msg;
  $('toastContainer').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}
// Optimistic write: with offline cache, a write promise only resolves once the server confirms,
// so we report success immediately and only complain if the server rejects it.
function run(p, okMsg) { toast(okMsg, 'success'); p.catch(e => { console.error(e); toast('Failed: ' + (e.code || e.message), 'error'); }); }

function setSync(text, bad = false) {
  $('syncStatusText').textContent = text;
  $('connectionBanner').className = 'border-b px-3 py-1 flex items-center gap-1.5 text-[11px] ' + (bad ? 'bg-rose-950/80 border-rose-800/50 text-rose-300' : 'bg-emerald-950/80 border-emerald-800/50 text-emerald-300');
}
addEventListener('offline', () => setSync('Offline: sales are saved and will sync later', true));
addEventListener('online', () => setSync('Back online, syncing...'));

// ====== Auth & roles (real, enforced by Firestore rules) ======
onAuthStateChanged(auth, user => {
  if (!user) { signInAnonymously(auth).catch(e => setSync('Sign-in failed: ' + e.code, true)); return; }
  isMom = !user.isAnonymous && user.email === MOM_EMAIL;
  applyRole();
  startListeners();
});

function switchRole(role) {
  if (role === 'admin') {
    if (isMom) return;
    const pw = prompt("Mom's password:");
    if (!pw) return;
    signInWithEmailAndPassword(auth, MOM_EMAIL, pw).then(() => toast('Mom (Admin) view', 'success'))
      .catch(() => toast('Incorrect password', 'error'));
  } else {
    if (!isMom) return;
    cart = []; renderCart();
    signInAnonymously(auth).then(() => toast('Shopkeeper view', 'info'));
  }
}

function applyRole() {
  const on = 'px-2.5 py-1 text-xs font-semibold rounded-lg transition-all bg-amber-500 text-slate-950 shadow-sm';
  const off = 'px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all';
  $('roleBtnAdmin').className = isMom ? on : off;
  $('roleBtnShop').className = isMom ? off : on;
  $('roleBadgeText').textContent = isMom ? 'Role: Admin (Mom)' : 'Role: Shopkeeper (Sell + Read-Only)';
  $('adminActionSection').classList.toggle('hidden', !isMom);
  renderItems(); renderSales();
}

// ====== Realtime listeners (restarted on every login change) ======
function startListeners() {
  unsubs.forEach(u => u()); unsubs = []; firstNotif = true;
  const onErr = e => { console.error(e); setSync(e.code === 'permission-denied' ? 'Permission denied: check Firestore rules' : 'Sync error: ' + e.code, true); };

  unsubs.push(onSnapshot(collection(db, 'items'), s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    renderItems(); fillSaleSelect();
    setSync(s.metadata.fromCache && !navigator.onLine ? 'Offline: showing saved data' : 'Live sync active');
  }, onErr));

  unsubs.push(onSnapshot(query(collection(db, 'sales'), orderBy('createdAt', 'desc'), limit(1000)), s => {
    sales = s.docs.map(d => {
      const x = { id: d.id, ...d.data() };
      x.dateKey = x.dateKey || dKey(x.createdAt);
      x.lines = x.lines || [{ name: x.itemName, qty: x.qty || 1, price: x.qty ? x.total / x.qty : x.total }];
      return x;
    });
    renderSales();
  }, onErr));

  unsubs.push(onSnapshot(query(collection(db, 'notifications'), orderBy('createdAt', 'desc'), limit(50)), s => {
    notifs = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!firstNotif && tab !== 'notifications' && s.docChanges().some(c => c.type === 'added' && !c.doc.metadata.hasPendingWrites)) $('unreadDot').classList.remove('hidden');
    firstNotif = false;
    renderNotifs();
  }, onErr));
}

// ====== Tabs & filters ======
function switchTab(t) {
  tab = t;
  ['inventory', 'sales', 'notifications'].forEach(n => {
    $('view-' + n).classList.toggle('hidden', n !== t);
    $('navTab-' + n).className = 'flex flex-col items-center gap-1 transition-colors ' + (n === t ? 'text-amber-400' : 'text-slate-400 hover:text-slate-200');
  });
  if (t === 'notifications') $('unreadDot').classList.add('hidden');
}
function setFilter(f) {
  filter = f;
  ['all', 'in_stock', 'out_of_stock', 'factory_low', 'in_transit'].forEach(x => {
    $('filterBtn-' + x).className = 'px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition-all ' + (x === f ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-900 text-slate-300 border border-slate-800');
  });
  renderItems();
}

// ====== Inventory ======
const BADGES = {
  in_stock: ['In Shop', 'emerald'], out_of_stock: ['Shop Out', 'rose'], factory_low: ['Factory Low', 'amber'], in_transit: ['In Transit', 'blue']
};
const badge = s => { const [t, c] = BADGES[s] || ['?', 'slate']; return `<span class="bg-${c}-950/80 text-${c}-300 border border-${c}-800 px-2 py-0.5 rounded-md text-[10px] font-bold whitespace-nowrap">${t}</span>`; };

function renderItems() {
  const q = $('searchInput').value.toLowerCase();
  const list = items.filter(i => (filter === 'all' || i.status === filter) && (i.name || '').toLowerCase().includes(q));
  $('itemsContainer').innerHTML = list.length ? list.map(i => `
    <div class="card space-y-2 shadow-md">
      <div class="flex gap-3">
        <img src="${esc(i.image) || PLACEHOLDER}" onerror="this.src='${PLACEHOLDER}'" class="w-20 h-20 rounded-xl object-cover border border-slate-800 shrink-0">
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2"><h4 class="font-bold text-sm text-white truncate">${esc(i.name)}</h4>${badge(i.status)}</div>
          <p class="text-base font-extrabold text-amber-400 mt-1">${money(i.price)} ETB</p>
          <p class="text-[10px] text-slate-500 mt-0.5">Updated: ${tStr(i.updatedAt || Date.now())}</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 pt-2 border-t border-slate-800/80">
      ${isMom ? `
        <button onclick="openStatusModal('${i.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-amber-400 font-semibold py-1.5 px-2 rounded-lg text-xs flex items-center justify-center gap-1"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Status / Dispatch</button>
        <button onclick="editItem('${i.id}')" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
        <button onclick="deleteItem('${i.id}')" class="p-1.5 bg-rose-950/60 text-rose-400 border border-rose-800/50 rounded-lg"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
      ` : `
        <button onclick="requestStockAlert('${i.id}')" class="flex-1 bg-rose-950/40 border border-rose-800/40 text-rose-300 font-medium py-1.5 px-2 rounded-lg text-xs flex items-center justify-center gap-1"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Sold Out / Request</button>
        <button onclick="quickSell('${i.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-3 rounded-lg text-xs flex items-center gap-1"><i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> Sell</button>
      `}
      </div>
    </div>`).join('') : `<div class="text-center py-10 text-slate-500 text-xs">${items.length ? 'No items match your search.' : 'No items yet.' + (isMom ? ' Tap "Add New Baltina Item".' : '')}</div>`;
  lucide.createIcons();
}

function handleImageSelected(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 400 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      img = c.toDataURL('image/jpeg', 0.7);
      showPreview();
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(file);
}
function showPreview() {
  $('imagePreview').src = img; $('imagePreview').classList.toggle('hidden', !img);
  $('imagePlaceholderIcon').classList.toggle('hidden', !!img);
}
function openAddItemModal() {
  editId = null; img = '';
  $('modalTitle').textContent = 'Add New Baltina Product';
  $('itemForm').reset(); showPreview();
  $('itemModal').classList.remove('hidden');
}
function editItem(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  editId = id; img = i.image || '';
  $('modalTitle').textContent = 'Edit Baltina Product';
  $('itemNameInput').value = i.name; $('itemPriceInput').value = i.price; $('itemStatusInput').value = i.status;
  showPreview(); $('itemModal').classList.remove('hidden');
}
const closeItemModal = () => $('itemModal').classList.add('hidden');

function handleSaveItem(e) {
  e.preventDefault();
  const name = $('itemNameInput').value.trim(), price = parseFloat($('itemPriceInput').value), status = $('itemStatusInput').value;
  if (!name || !(price > 0)) return toast('Enter a name and a valid price', 'error');
  const id = editId || 'item-' + Date.now();
  const old = items.find(i => i.id === id);
  run(setDoc(doc(db, 'items', id), { name, price, status, image: img || old?.image || '', updatedAt: Date.now() }, { merge: true }), editId ? 'Item updated' : 'Item added');
  closeItemModal();
}
function deleteItem(id) {
  if (confirm('Delete this item?')) run(deleteDoc(doc(db, 'items', id)), 'Item deleted');
}

function openStatusModal(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  statusId = id;
  $('statusModalItemName').textContent = i.name; $('modalStatusSelect').value = i.status; $('modalStatusNote').value = '';
  $('statusModal').classList.remove('hidden');
}
const closeStatusModal = () => $('statusModal').classList.add('hidden');

function notifyDoc(b, title, message, type) {
  const now = Date.now();
  b.set(doc(db, 'notifications', 'notif-' + now), { title, message, type, createdAt: now });
}
function confirmStatusUpdate() {
  const i = items.find(x => x.id === statusId); if (!i) return;
  const status = $('modalStatusSelect').value, note = $('modalStatusNote').value.trim();
  const b = writeBatch(db);
  b.set(doc(db, 'items', i.id), { status, updatedAt: Date.now() }, { merge: true });
  notifyDoc(b, 'Dispatch & Status Update', `Mom updated ${i.name} to "${status.replace('_', ' ')}".${note ? ' Note: ' + note : ''}`, 'info');
  run(b.commit(), 'Status updated, shop notified');
  closeStatusModal();
}
function requestStockAlert(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  if (!confirm(`Report "${i.name}" as sold out and alert Mom?`)) return;
  const b = writeBatch(db);
  b.set(doc(db, 'items', id), { status: 'out_of_stock', updatedAt: Date.now() }, { merge: true });
  notifyDoc(b, 'Shop Alert: Sold Out', `Shopkeeper reported ${i.name} is SOLD OUT at the shop. Please prepare factory dispatch.`, 'warning');
  run(b.commit(), 'Sold-out alert sent to Mom');
}

// ====== Sales: cart -> one saved sale ======
function fillSaleSelect() {
  const sel = $('saleItemSelect'), cur = sel.value;
  sel.innerHTML = '<option value="">-- Choose Item --</option>' + items.map(i => `<option value="${i.id}">${esc(i.name)} (${money(i.price)} ETB)</option>`).join('');
  sel.value = cur;
}
function addToCart(id, qty = 1) {
  const i = items.find(x => x.id === id);
  if (!i || !(qty > 0)) return;
  const line = cart.find(c => c.id === id);
  line ? line.qty += qty : cart.push({ id, name: i.name, price: i.price, qty });
  renderCart();
}
function addFromForm() {
  const id = $('saleItemSelect').value;
  if (!id) return toast('Choose an item first', 'error');
  addToCart(id, parseFloat($('saleQtyInput').value) || 1);
  $('saleQtyInput').value = 1; $('saleItemSelect').value = '';
}
function quickSell(id) { addToCart(id, 1); toast('Added to cart. Open Sales Log to finish.', 'success'); }
function changeQty(i, d) { cart[i].qty = Math.max(0.5, +(cart[i].qty + d).toFixed(2)); renderCart(); }
function removeLine(i) { cart.splice(i, 1); renderCart(); }

function renderCart() {
  const total = cart.reduce((a, c) => a + c.price * c.qty, 0);
  $('cartList').innerHTML = cart.length ? cart.map((c, i) => `
    <div class="flex items-center justify-between gap-2 bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs">
      <div class="min-w-0 flex-1"><p class="font-bold text-white truncate">${esc(c.name)}</p><p class="text-[10px] text-slate-400">${money(c.price)} ETB each</p></div>
      <div class="flex items-center gap-1.5">
        <button onclick="changeQty(${i},-1)" class="w-6 h-6 rounded-lg bg-slate-800 font-bold">-</button>
        <span class="w-8 text-center font-bold">${c.qty}</span>
        <button onclick="changeQty(${i},1)" class="w-6 h-6 rounded-lg bg-slate-800 font-bold">+</button>
      </div>
      <span class="w-20 text-right font-extrabold text-amber-400">${money(c.price * c.qty)}</span>
      <button onclick="removeLine(${i})" class="text-rose-400 p-1">✕</button>
    </div>`).join('') : '<p class="text-xs text-slate-500 text-center py-2">Cart is empty. Add items above.</p>';
  $('cartTotal').textContent = money(total) + ' ETB';
  $('completeBtn').disabled = !cart.length;
  $('completeBtn').classList.toggle('opacity-40', !cart.length);
}
function completeSale() {
  if (!cart.length) return;
  const now = Date.now();
  const lines = cart.map(c => ({ name: c.name, price: c.price, qty: c.qty })); // price frozen at time of sale
  const total = lines.reduce((a, l) => a + l.price * l.qty, 0);
  run(setDoc(doc(db, 'sales', 'sale-' + now + '-' + Math.random().toString(36).slice(2, 6)), {
    lines, total, createdAt: now, dateKey: dKey(now), seller: isMom ? 'Mom' : 'Shopkeeper'
  }), `Sale recorded: ${money(total)} ETB`);
  cart = []; renderCart();
}
function deleteSale(id) { if (confirm('Delete this sale record?')) run(deleteDoc(doc(db, 'sales', id)), 'Sale deleted'); }
function pickDate(d) { viewDate = d || dKey(); renderSales(); }

function renderSales() {
  $('momSalesBlock').classList.toggle('hidden', !isMom);
  const day = isMom ? viewDate : dKey();
  const ds = sales.filter(s => s.dateKey === day);
  const rev = ds.reduce((a, s) => a + s.total, 0);
  const cnt = ds.reduce((a, s) => a + s.lines.reduce((b, l) => b + l.qty, 0), 0);
  const label = day === dKey() ? 'Today' : day;
  $('statTotalRevenue').textContent = money(rev) + ' ETB';
  $('statTotalCount').textContent = cnt + ' Packs';
  $('statLabel1').textContent = label + ' · ' + ds.length + ' sales';
  $('statLabel2').textContent = label;

  $('salesHistoryList').innerHTML = ds.length ? ds.map(s => `
    <div class="card flex items-center justify-between gap-2 text-xs">
      <div class="min-w-0">
        <p class="font-bold text-white">${s.lines.map(l => `${l.qty}× ${esc(l.name)}`).join(', ')}</p>
        <p class="text-[10px] text-slate-400">By ${esc(s.seller || s.sellerRole || '')} at ${tStr(s.createdAt)}</p>
      </div>
      <div class="text-right shrink-0">
        <p class="font-extrabold text-amber-400">+${money(s.total)} ETB</p>
        ${isMom ? `<button onclick="deleteSale('${s.id}')" class="text-[10px] text-rose-400">delete</button>` : ''}
      </div>
    </div>`).join('') : '<p class="text-xs text-slate-500 text-center py-4">No sales recorded for this day.</p>';

  if (isMom) {
    $('salesDate').value = viewDate;
    const byDay = {};
    sales.forEach(s => { (byDay[s.dateKey] ||= { n: 0, t: 0 }); byDay[s.dateKey].n++; byDay[s.dateKey].t += s.total; });
    const rows = Object.keys(byDay).sort().reverse().slice(0, 14);
    $('dailySummary').innerHTML = rows.length ? '<p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Daily totals</p>' + rows.map(k => `
      <button onclick="pickDate('${k}')" class="w-full flex justify-between items-center text-xs rounded-xl px-3 py-2 border ${k === day ? 'bg-amber-500/10 border-amber-500/40' : 'bg-slate-900 border-slate-800'}">
        <span class="font-semibold">${k === dKey() ? 'Today' : k} <span class="text-slate-500 font-normal">· ${byDay[k].n} sales</span></span>
        <span class="font-extrabold text-amber-400">${money(byDay[k].t)} ETB</span>
      </button>`).join('') : '';
  }
}

// ====== Notifications ======
function renderNotifs() {
  $('notifBadge').textContent = notifs.length + ' Messages';
  $('notificationsList').innerHTML = notifs.length ? notifs.map(n => `
    <div class="card space-y-1">
      <div class="flex items-center justify-between"><span class="text-xs font-bold text-amber-400">${esc(n.title)}</span><span class="text-[10px] text-slate-500">${dKey(n.createdAt)} ${tStr(n.createdAt)}</span></div>
      <p class="text-xs text-slate-300">${esc(n.message)}</p>
    </div>`).join('') : '<p class="text-xs text-slate-500 text-center py-4">No notifications.</p>';
}

Object.assign(window, { switchRole, switchTab, setFilter, renderItems, handleImageSelected, openAddItemModal, closeItemModal, handleSaveItem, editItem, deleteItem, openStatusModal, closeStatusModal, confirmStatusUpdate, requestStockAlert, addFromForm, quickSell, changeQty, removeLine, completeSale, deleteSale, pickDate });
renderCart(); lucide.createIcons();
</script>
</head>

<body class="h-full flex justify-center bg-black font-sans antialiased text-slate-100 select-none">
<div class="w-full max-w-md h-full bg-slate-950 flex flex-col relative overflow-hidden shadow-2xl border-x border-slate-800/80">

  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-500 to-emerald-600 p-0.5">
        <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center"><i data-lucide="store" class="w-5 h-5 text-amber-400"></i></div>
      </div>
      <div>
        <h1 class="font-extrabold text-base tracking-tight text-white flex items-center gap-1.5">Guadaye Baltina <span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold px-1.5 py-0.5 rounded-md uppercase">Mart</span></h1>
        <p class="text-[11px] text-slate-400 font-medium leading-none" id="roleBadgeText">Role: Shopkeeper</p>
      </div>
    </div>
    <div class="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
      <button id="roleBtnAdmin" onclick="switchRole('admin')" class="px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-400">Mom</button>
      <button id="roleBtnShop" onclick="switchRole('shopkeeper')" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-amber-500 text-slate-950">Shop</button>
    </div>
  </header>

  <div id="connectionBanner" class="bg-slate-900 border-b border-slate-800 px-3 py-1 flex items-center gap-1.5 text-[11px] text-slate-400">
    <span class="w-2 h-2 rounded-full bg-current animate-pulse"></span><span id="syncStatusText">Connecting...</span>
  </div>

  <main class="flex-1 overflow-y-auto p-4 pb-24 no-scrollbar">

    <section id="view-inventory" class="space-y-4">
      <div class="space-y-2.5">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="renderItems()" placeholder="Search Shiro, Berbere, Butter..." class="inp pl-10">
        </div>
        <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
          <button onclick="setFilter('all')" id="filterBtn-all" class="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold whitespace-nowrap">All</button>
          <button onclick="setFilter('in_stock')" id="filterBtn-in_stock" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-300 border border-slate-800 font-medium whitespace-nowrap">In Shop</button>
          <button onclick="setFilter('out_of_stock')" id="filterBtn-out_of_stock" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-300 border border-slate-800 font-medium whitespace-nowrap">Shop Out</button>
          <button onclick="setFilter('factory_low')" id="filterBtn-factory_low" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-300 border border-slate-800 font-medium whitespace-nowrap">Factory Low</button>
          <button onclick="setFilter('in_transit')" id="filterBtn-in_transit" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-300 border border-slate-800 font-medium whitespace-nowrap">In Transit</button>
        </div>
      </div>
      <div id="adminActionSection" class="hidden">
        <button onclick="openAddItemModal()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 active:scale-[0.99]"><i data-lucide="plus-circle" class="w-5 h-5"></i> Add New Baltina Item</button>
      </div>
      <div id="itemsContainer" class="space-y-3"></div>
    </section>

    <section id="view-sales" class="hidden space-y-4">
      <div id="momSalesBlock" class="hidden space-y-2">
        <div class="flex items-center gap-2"><label class="text-xs text-slate-400 font-medium">Day</label><input type="date" id="salesDate" onchange="pickDate(this.value)" class="inp flex-1"></div>
        <div id="dailySummary" class="space-y-1.5"></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="card p-3.5"><p class="text-xs text-slate-400 font-medium">Revenue</p><p class="text-xl font-extrabold text-amber-400 mt-1" id="statTotalRevenue">0.00 ETB</p><p class="text-[10px] text-slate-500 mt-0.5" id="statLabel1">Today</p></div>
        <div class="card p-3.5"><p class="text-xs text-slate-400 font-medium">Items Sold</p><p class="text-xl font-extrabold text-emerald-400 mt-1" id="statTotalCount">0 Packs</p><p class="text-[10px] text-slate-500 mt-0.5" id="statLabel2">Today</p></div>
      </div>

      <div class="card p-4 space-y-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><i data-lucide="shopping-cart" class="w-4 h-4 text-amber-400"></i> New Sale</h3>
        <div class="flex gap-2">
          <select id="saleItemSelect" class="inp flex-1 min-w-0"><option value="">-- Choose Item --</option></select>
          <input type="number" id="saleQtyInput" min="0.5" step="0.5" value="1" class="inp !w-16 text-center">
          <button onclick="addFromForm()" class="bg-amber-500 text-slate-950 font-bold px-3 rounded-xl text-sm">Add</button>
        </div>
        <div id="cartList" class="space-y-1.5"></div>
        <div class="flex items-center justify-between border-t border-slate-800 pt-3">
          <span class="text-xs text-slate-400 font-medium">Total</span>
          <span id="cartTotal" class="text-lg font-extrabold text-amber-400">0.00 ETB</span>
        </div>
        <button id="completeBtn" onclick="completeSale()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm flex items-center justify-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Complete &amp; Record Sale</button>
      </div>

      <div class="space-y-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sales History</h3>
        <div id="salesHistoryList" class="space-y-2"></div>
      </div>
    </section>

    <section id="view-notifications" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><i data-lucide="bell" class="w-4 h-4 text-amber-400"></i> Stock Alerts &amp; Dispatch Feed</h3>
        <span id="notifBadge" class="text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full">0 Messages</span>
      </div>
      <div id="notificationsList" class="space-y-2.5"></div>
    </section>
  </main>

  <nav class="absolute bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 py-2 px-4 flex justify-around">
    <button onclick="switchTab('inventory')" id="navTab-inventory" class="flex flex-col items-center gap-1 text-amber-400"><i data-lucide="grid" class="w-5 h-5"></i><span class="text-[10px] font-bold">Mart Items</span></button>
    <button onclick="switchTab('sales')" id="navTab-sales" class="flex flex-col items-center gap-1 text-slate-400"><i data-lucide="receipt" class="w-5 h-5"></i><span class="text-[10px] font-bold">Sales Log</span></button>
    <button onclick="switchTab('notifications')" id="navTab-notifications" class="flex flex-col items-center gap-1 text-slate-400">
      <div class="relative"><i data-lucide="bell" class="w-5 h-5"></i><span id="unreadDot" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-500 rounded-full border-2 border-slate-900"></span></div>
      <span class="text-[10px] font-bold">Alerts</span>
    </button>
  </nav>

  <!-- Add / Edit item -->
  <div id="itemModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-4 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalTitle" class="text-base font-bold text-white">Add New Baltina Product</h3>
        <button onclick="closeItemModal()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="itemForm" onsubmit="handleSaveItem(event)" class="space-y-3">
        <div>
          <label class="lbl">Item Photo</label>
          <div class="flex items-center gap-3">
            <div class="w-16 h-16 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center overflow-hidden shrink-0">
              <i data-lucide="image" class="w-6 h-6 text-slate-600" id="imagePlaceholderIcon"></i>
              <img id="imagePreview" src="" alt="" class="hidden w-full h-full object-cover">
            </div>
            <div class="flex-1">
              <input type="file" id="itemImageInput" accept="image/*" onchange="handleImageSelected(event)" class="hidden">
              <button type="button" onclick="itemImageInput.click()" class="w-full bg-slate-800 text-xs text-slate-200 font-semibold py-2 px-3 rounded-xl border border-slate-700 flex items-center justify-center gap-1.5"><i data-lucide="camera" class="w-4 h-4 text-amber-400"></i> Take / Pick Photo</button>
            </div>
          </div>
        </div>
        <div><label class="lbl">Product Name</label><input type="text" id="itemNameInput" required class="inp" placeholder="e.g. Shiro Medin"></div>
        <div><label class="lbl">Price per Pack/Kg (ETB)</label><input type="number" step="0.5" min="0" id="itemPriceInput" required class="inp" placeholder="e.g. 450"></div>
        <div><label class="lbl">Shop &amp; Factory Status</label>
          <select id="itemStatusInput" class="inp">
            <option value="in_stock">In Stock (Available at Shop)</option>
            <option value="out_of_stock">Out of Stock at Shop</option>
            <option value="in_transit">Restocking / In Transit</option>
            <option value="factory_low">Low Stock at Factory</option>
          </select>
        </div>
        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeItemModal()" class="flex-1 bg-slate-800 text-slate-300 font-semibold py-2.5 rounded-xl text-xs">Cancel</button>
          <button type="submit" class="flex-1 bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Status / dispatch -->
  <div id="statusModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-4 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Update Status &amp; Dispatch</h3>
        <button onclick="closeStatusModal()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-xs text-slate-300" id="statusModalItemName"></p>
      <div><label class="lbl">New Status</label>
        <select id="modalStatusSelect" class="inp">
          <option value="in_stock">✅ In Stock (Available at Shop)</option>
          <option value="in_transit">🚚 Restocking / In Transit</option>
          <option value="factory_low">⚠️ Low Stock at Factory</option>
          <option value="out_of_stock">❌ Out of Stock</option>
        </select>
      </div>
      <div><label class="lbl">Optional Note for Shopkeeper</label><input type="text" id="modalStatusNote" class="inp" placeholder="e.g., 20 bags prepared, driver on the way"></div>
      <div class="flex gap-2">
        <button onclick="closeStatusModal()" class="flex-1 bg-slate-800 text-slate-300 font-semibold py-2.5 rounded-xl text-xs">Cancel</button>
        <button onclick="confirmStatusUpdate()" class="flex-1 bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Update &amp; Notify</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed top-14 left-1/2 -translate-x-1/2 w-full max-w-xs z-[60] pointer-events-none space-y-2 px-2"></div>
</div>
</body>
</html>
